name: Build and Push Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    
jobs:
  build-and-push:
    runs-on: ubunut-latest


    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Log in Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.bassanty }}
          password: ${{ secrets.dckr_pat_SXFAx4J7DFpebRiUmabVHR5NBn4 }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
           context: .
           file: ./Dockerfile
           push: true
           tags:
             ${{ secrets.DOCKER_USERNAME }}/reactapp:latest
             ${{ secrets.DOCKER_USERNAME }}/reactapp:${{ github.sha }}


                 